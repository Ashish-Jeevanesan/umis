server:
  port: -1

spring:
  application:
    name: po-processor-test
  datasource:
    url: jdbc:h2:mem:po_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS po_processor
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
  rabbitmq:
    host: localhost
    port: 5672
    dynamic: false
    listener:
      simple:
        auto-startup: false

po:
  rabbitmq:
    exchange: umis.events
    queue: po-processor.queue.email-ingested
    routing-key: umis.events.email.ingested
    dlx-exchange: umis.dlx
    dlq-queue: po-processor.queue.dlq
    dlq-routing-key: po-processor.dlq
    prefetch-count: 5
    max-retries: 3
  storage:
    type: LOCAL
    local-base-path: ./target/test-storage

umis:
  base-url: http://localhost:8080
  consumer-id: PO_PROCESSING
  auth:
    email: ""
    password: ""

logging:
  level:
    root: WARN
    com.po.processor: DEBUG
