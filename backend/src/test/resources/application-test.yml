spring:
  datasource:
    url: jdbc:h2:mem:umistest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

umis:
  storage:
    endpoint: "http://localhost:9000"
    bucket-name: "test-bucket"
  rabbitmq:
    exchange: "test.events"
    queue-email-ingested: "test.queue.email-ingested"
    queue-dlq: "test.queue.dlq"
    routing-key-prefix: "test.events"

logging:
  level:
    root: INFO
    com.umis: DEBUG
